<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><link rel="stylesheet" href="popup.css"><title>观影账号</title><body><h2>观影 · B 站摘记</h2><p>与桌面观影使用同一服务和账号。</p><form id="login"><label>服务地址<input id="url" type="url" value="http://127.0.0.1:48721" required></label><label>账号<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" minlength="10" required></label><label><input id="register" type="checkbox"> 注册新账号</label><label><input id="migrate" type="checkbox">改连新服务 / 账号（需先同步完待同步笔记）</label><label>在线服务注册邀请码<input id="code" type="password"></label><button id="submit">登录 / 注册</button></form><p id="status" role="status"></p><button id="open">打开此页摘记面板</button> <button id="retry">重试同步</button> <button id="logout">退出登录</button><details><summary>新手指引</summary><p>① 在观影桌面版注册账号。② 此处填相同地址及账号。③ 在 B 站视频页点击本插件图标，打开面板。④ N 台词、S 截图、B 画面、I/O 片段；先开启快捷键。</p><p>默认地址仅用于本机，需保持观影运行。跨电脑使用已部署的 HTTPS 服务。字幕只提取原文，不翻译；不可读取时手动填写。截图若只能截屏，会标明屏幕像素尺寸，不保证视频原始分辨率。受保护视频可能无法截图。</p></details><script src="popup.js"></script></body></html>
