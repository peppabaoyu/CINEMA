<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17171c"><title>观影 · 随身日记</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/mobile.css?v=__MOBILE_VERSION__"></head><body>
<header><img src="/icon.png" alt="影"><div><h1>观影 · 随身日记</h1><small id="mobile-version">手机版 __MOBILE_VERSION__</small><br><small id="connection">正在检查电脑连接…</small></div><button id="disconnect">退出连接</button></header>
<section id="pairing" class="card"><h2>连接你的电脑</h2><p>扫码后核对两边同一个六位确认码，在电脑允许配对。</p><label>这台设备叫什么<input id="device-name" maxlength="60" placeholder="我的 iPad"></label><button id="pair" class="primary">请求配对</button><p id="pair-message"></p></section>
<nav><button data-tab="library">电脑片库</button><button data-tab="computer">电脑笔记</button><button data-tab="local">本机笔记</button><button data-tab="offers">电脑发来的</button></nav>
<main><section id="player" class="card" hidden><div class="row"><h2 id="player-title">观看</h2><button id="close-player">关闭视频</button></div><video id="video" controls playsinline preload="metadata"></video><p id="player-notice">请保持电脑开启；原片保留，不兼容编码会准备原分辨率的手机播放副本。</p><progress id="player-progress" max="100" hidden></progress><button id="compatibility-retry" hidden>重新连接播放</button><div class="row wrap"><select id="speed" aria-label="倍速"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="mark-start">片段起点</button><button id="mark-end">片段终点</button><button id="quote">摘一句</button><button id="capture">收藏当前帧</button><button id="end-review" hidden>结束回看</button></div></section>
<section id="selection" class="card" hidden><div class="row wrap"><label class="inline"><input id="all" type="checkbox">全选当前列表</label><b id="selected-count">已选 0 条</b><button id="clear-selection">取消选择</button></div><div class="row wrap" id="fields"><label class="inline"><input data-field="text" type="checkbox" checked>台词</label><label class="inline"><input data-field="comment" type="checkbox" checked>感想</label><label class="inline"><input data-field="tags" type="checkbox" checked>标签</label><label class="inline"><input data-field="images" type="checkbox" checked>截图</label></div><label>遇到重复笔记<select id="duplicates"><option value="skip">跳过已有笔记</option><option value="replace">替换所选内容，保留未选部分</option><option value="copy">另存一份</option></select></label><div class="row wrap"><button id="receive" class="primary">复制所选到本设备</button><button id="send" class="primary">传回电脑</button><button id="offline">导出离线阅读</button><button id="backup">导出所选备份</button></div><p class="hint">先选择笔记和内容，再确认传输；不自动发送全部。片名、集数及起止时间用于归档。副本保存在当前浏览器，清理浏览器数据前请导出备份。</p></section>
<div class="row wrap"><h2 id="section-title"></h2><button id="refresh">刷新</button><button id="new-note">写一条本机笔记</button><label id="restore-label" class="file-button">导入笔记备份<input id="restore" type="file" accept=".json,application/json"></label></div><input id="search" placeholder="搜索片名、笔记" aria-label="搜索"><div id="content"></div><section id="editor" class="card" hidden></section><p class="hint">本页是局域网移动网页端。电脑关机后不能串流或传输；已打开的本机笔记页可继续查看。完全离线重开阅读请使用导出的阅读文件。IP 地址变更时，可通过笔记备份迁移副本。</p></main>
<dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="row"><button id="confirm-cancel">取消</button><button id="confirm-ok" class="primary">确认</button></div></dialog><div id="message" role="status"></div><script src="/mobile.js?v=__MOBILE_VERSION__"></script></body></html>
