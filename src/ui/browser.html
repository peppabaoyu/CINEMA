<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' gyasset: data:; style-src 'self'; script-src 'self'"><title>观影 · 插件浏览器</title><link rel="stylesheet" href="browser.css"></head><body>
<header><div class="address-row"><button id="home" title="浏览器搜索首页">影</button><button id="back" title="后退">←</button><button id="forward" title="前进">→</button><button id="reload" title="重新加载">↻</button><form id="navigation"><input id="address" aria-label="网址或搜索词" placeholder="输入网址或搜索影片、网站"><button>前往</button></form><button id="panel-toggle">收起摘记</button><button id="immersive">沉浸 Alt+H</button></div><div class="tools"><select id="sites" aria-label="常用网站"><option value="">常用网站</option></select><button data-action="quote">摘一句 Alt+N</button><button data-action="shot">截图 Alt+S</button><button data-action="frame">收藏帧 Alt+B</button><button data-action="begin">起点 Alt+I</button><button data-action="end">终点 Alt+O</button><button id="external">系统浏览器 ↗</button></div><div id="status" role="status">浏览网页，播放视频后即可摘记。</div></header>
<aside id="panel"><div class="panel-title"><h2>随看随记</h2><button id="close">×</button></div><p class="hint">笔记直接保存到观影。网页快捷键使用 Alt，搜索与打字不受影响。</p><label>当前播放器<select id="videos"><option value="">尚未检测到视频</option></select></label><div class="play-controls"><button id="play">暂停／播放</button><button id="back5">−5 秒</button><button id="next5">+5 秒</button><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="mute">静音</button><button id="prev-frame">上一帧</button><button id="next-frame">下一帧</button></div><p id="video-info">在网页中开始播放后自动识别；嵌入式播放器也会检测。</p><p id="range"></p><button id="manual">手动记台词／页面截图</button><button id="exit-review" hidden>结束回看片段</button><div id="editor" hidden></div><div class="notes-heading"><h3>这页的摘记</h3><button id="export">导出图文笔记</button></div><div id="notes"></div><p class="hint">优先提取原字幕，不翻译。无可读字幕时可以手填。截图会标明「视频原尺寸」或「网页显示尺寸」。特殊播放器、受保护的视频可能无法提取或截图。</p><button id="help">查看操作指引</button></aside><div id="message" role="status"></div><button id="restore-chrome" title="退出沉浸，展开摘记">影 · 展开 Alt+H</button><script src="browser-ui.js"></script></body></html>
